name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Font files are pinned by fontMeta.json, so its hash is a complete cache key.
      - uses: actions/cache@v4
        with:
          path: public/fonts
          key: fonts-${{ hashFiles('src/generated/fontMeta.json') }}

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
